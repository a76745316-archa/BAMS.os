<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VaidyaOS - Minimalist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], devanagari: ['Noto Sans Devanagari', 'sans-serif'] },
          colors: { bg: '#0f172a', card: '#1e293b', accent: '#10b981', textmain: '#f8fafc', textmuted: '#94a3b8' }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .clean-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .btn-primary { background: #10b981; color: #022c22; font-weight: 700; border-radius: 12px; padding: 10px 16px; transition: opacity 0.2s; }
    .btn-primary:active { opacity: 0.8; }
    .btn-secondary { background: #334155; color: #f8fafc; font-weight: 600; border-radius: 12px; padding: 10px 16px; }
  </style>
</head>
<body class="min-h-screen select-none">
    <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800 px-5 py-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Vaidya<span class="text-emerald-400">OS</span></h1>
        <p class="text-xs text-slate-400 font-medium">Clear Mind. Sharp Focus.</p>
      </div>
      <button onclick="openModal('apiModal')" class="bg-slate-800 text-slate-300 p-2.5 rounded-xl text-sm border border-slate-700">⚙️ AI Settings</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-2xl mx-auto px-4 pt-5 space-y-6" id="app-main"></main>

  <!-- API KEY MODAL -->
  <div id="apiModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="clean-card w-full max-w-md p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold">Google Gemini AI Key</h3>
        <button onclick="closeModal('apiModal')" class="text-slate-400 hover:text-white font-bold text-xl">✕</button>
      </div>
      <p class="text-sm text-slate-400">AI Shloka fetch aur Pronunciation check ke liye free key paste karein.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500" />
      <div class="flex gap-3">
        <button onclick="saveApiKey()" class="btn-primary flex-1">Save Key</button>
        <button onclick="closeModal('apiModal')" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- 4-TAB BOTTOM NAV -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#0f172a]/95 backdrop-blur-lg border-t border-slate-800 px-3 py-2">
    <div class="max-w-2xl mx-auto grid grid-cols-4 gap-2">
      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center py-2 rounded-xl text-emerald-400 bg-slate-800">
        <span class="text-xl mb-1">🏠</span><span class="text-[10px] font-bold">Home</span>
      </button>
      <button onclick="switchTab('vault')" id="nav-vault" class="flex flex-col items-center py-2 rounded-xl text-slate-500 hover:text-slate-300">
        <span class="text-xl mb-1">🗂️</span><span class="text-[10px] font-bold">Vault</span>
      </button>
      <button onclick="switchTab('practice')" id="nav-practice" class="flex flex-col items-center py-2 rounded-xl text-slate-500 hover:text-slate-300">
        <span class="text-xl mb-1">🎙️</span><span class="text-[10px] font-bold">Practice</span>
      </button>
      <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center py-2 rounded-xl text-slate-500 hover:text-slate-300">
        <span class="text-xl mb-1">✓</span><span class="text-[10px] font-bold">Tasks</span>
      </button>
    </div>
  </nav>
    <!-- TAB TEMPLATES (Injected via JS) -->
  <template id="tpl-home">
    <div class="space-y-5">
      <!-- Minimal Progress Card -->
      <div class="clean-card p-5 flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400 font-medium">Today's Discipline</p>
          <h2 class="text-3xl font-extrabold text-white mt-1" id="homeProgressTxt">0%</h2>
          <p class="text-xs text-emerald-400 mt-1" id="homeStreak">Streak: 1 Day 🔥</p>
        </div>
        <div class="w-16 h-16 rounded-full border-4 border-slate-700 flex items-center justify-center relative">
          <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
            <circle id="homeRing" cx="50" cy="50" r="46" stroke="#10b981" stroke-width="8" fill="none" stroke-dasharray="289" stroke-dashoffset="289" class="transition-all duration-700"></circle>
          </svg>
        </div>
      </div>
      <!-- Quick Stats -->
      <div class="grid grid-cols-2 gap-3">
        <div class="clean-card p-4">
          <p class="text-[11px] text-slate-400">Total Shlokas Read</p>
          <p class="text-xl font-bold text-amber-400 mt-1" id="homeTotalRead">0</p>
        </div>
        <div class="clean-card p-4">
          <p class="text-[11px] text-slate-400">Total AI Chants</p>
          <p class="text-xl font-bold text-indigo-400 mt-1" id="homeTotalChant">0</p>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-tasks">
    <div class="space-y-5">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-white">Daily Targets</h2>
        <button onclick="resetTasks()" class="text-xs text-slate-400 underline">Reset Today</button>
      </div>
      <!-- Add Task Bar -->
      <div class="flex gap-2">
        <input type="text" id="taskInput" placeholder="Add a new task..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500" onkeypress="if(event.key === 'Enter') addTask()" />
        <button onclick="addTask()" class="btn-primary">Add</button>
      </div>
      <!-- Task List -->
      <div id="taskList" class="space-y-2"></div>
    </div>
  </template>
    <template id="tpl-vault">
    <div class="space-y-4">
      <!-- Breadcrumb Navigation -->
      <div id="vaultBreadcrumbs" class="flex items-center gap-2 overflow-x-auto no-scrollbar text-xs font-semibold text-emerald-400 bg-slate-900/50 p-3 rounded-xl border border-slate-800">
        <!-- Filled by JS -->
      </div>
      
      <!-- Dynamic Content Area (Shows Folders or Shlokas) -->
      <div id="vaultContent" class="space-y-3"></div>
    </div>
  </template>

  <!-- Edit/Add Shloka Modal -->
  <div id="editShlokaModal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="clean-card w-full max-w-lg max-h-[85vh] overflow-y-auto p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white">✏️ Edit Shloka</h3>
        <button onclick="closeModal('editShlokaModal')" class="text-slate-400 hover:text-white font-bold text-xl">✕</button>
      </div>
      <input type="hidden" id="editId" />
      <input type="text" id="editRef" placeholder="Page / Reference No." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white" />
      <textarea id="editSan" rows="2" placeholder="Sanskrit Shloka..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-devanagari"></textarea>
      <textarea id="editBreak" rows="2" placeholder="Sandhi Breakdown..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white"></textarea>
      <textarea id="editHin" rows="2" placeholder="Hindi Meaning..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-devanagari"></textarea>
      <textarea id="editEng" rows="2" placeholder="English Meaning..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white"></textarea>
      <button onclick="saveShloka()" class="w-full btn-primary py-3">Save Changes</button>
    </div>
  </div>
    <template id="tpl-practice">
    <div class="space-y-5">
      <div class="flex items-center justify-between bg-slate-800 p-2 rounded-xl">
        <select id="pracShlokaSelect" onchange="loadPracShloka()" class="w-full bg-transparent text-sm text-emerald-400 font-bold focus:outline-none truncate px-2"></select>
      </div>

      <!-- Shloka Display -->
      <div class="clean-card p-5 space-y-4 border-l-4 border-l-emerald-500">
        <p id="pracSan" class="font-devanagari text-lg font-bold text-amber-300 leading-relaxed"></p>
        <p id="pracBreak" class="text-xs text-slate-300"></p>
        <div class="flex gap-2 pt-2 border-t border-slate-700">
          <button onclick="speakSanskrit()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-semibold">🔊 Listen</button>
          <button onclick="showMeaningAlert()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-semibold">📖 Meaning</button>
        </div>
      </div>

      <!-- Advanced Recorder Lab -->
      <div class="clean-card p-5 text-center space-y-4">
        <p id="recStatus" class="text-sm text-slate-400 font-medium">Tap to chant. Read clearly.</p>
        
        <!-- Primary Action -->
        <button id="btnRecord" onclick="toggleRecord()" class="w-16 h-16 mx-auto rounded-full bg-red-500 text-white flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(239,68,68,0.4)] transition-all">🎙️</button>
        
        <!-- Post-Record Actions (Hidden initially) -->
        <div id="postRecActions" class="hidden space-y-3">
          <audio id="audioPlayer" controls class="w-full h-10 rounded-lg outline-none"></audio>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="retryRecord()" class="btn-secondary text-xs">↺ Retry</button>
            <button id="btnCheckAi" onclick="checkWithAI()" class="btn-primary text-xs flex items-center justify-center gap-1">✨ Evaluate AI</button>
          </div>
          <button onclick="nextShloka()" class="w-full bg-slate-800 border border-slate-600 text-slate-300 text-xs font-bold py-2.5 rounded-xl mt-2">Next Shloka →</button>
        </div>
      </div>

      <!-- AI Feedback Box -->
      <div id="aiFeedback" class="hidden clean-card p-4 border border-emerald-500/50 space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-emerald-400">Pronunciation Score</span>
          <span id="aiScore" class="bg-emerald-500 text-slate-900 text-xs font-extrabold px-2 py-0.5 rounded">0%</span>
        </div>
        <p id="aiComment" class="text-xs text-slate-300 leading-relaxed"></p>
      </div>
    </div>
    </template>
    <script>
// CORE STATE
let state = {
  apiKey: localStorage.getItem('vaidya_api_key') || '',
  tasks: JSON.parse(localStorage.getItem('vaidya_tasks')) || [
    { id: 1, text: "Gym: 60m Lift + 25m Cardio", done: false },
    { id: 2, text: "Academic: Read 2 New Shlokas", done: false },
    { id: 3, text: "Content: 20m Shoot / Edit", done: false },
    { id: 4, text: "Sleep: Lights out by 12:15 AM", done: false }
  ],
  shlokas: JSON.parse(localStorage.getItem('vaidya_shlokas')) || [],
  vaultPath: { prof: null, subject: null, chapter: null }
};

// SYLLABUS HIERARCHY
const SYLLABUS = {
  "1st Prof": {
    "Kriya Sharir (Physiology)": ["Ch 1: Dosha-Dhatu-Mala", "Ch 2: Prakriti & Agni", "Ch 3: Aharapaka"],
    "Rachana Sharir (Anatomy)": ["Ch 1: Shariropakramaniya", "Ch 2: Garbha Sharir", "Ch 3: Marma Sharir"],
    "Padartha Vijnanam": ["Ch 1: Darshana & Dravya", "Ch 2: Guna & Karma", "Ch 3: Pramana"],
    "Sanskrit & Samhita": ["Ch 1: Vyakarana", "Ch 2: Ashtanga Sutrasthana 1-15"]
  },
  "2nd Prof": {
    "Dravyaguna Vigyan": ["Ch 1: Rasa Panchaka", "Ch 2: Important Herbs"],
    "Roga Nidan": ["Ch 1: Nidana Panchaka", "Ch 2: Srotodushti"]
  }
};

// INITIALIZATION
function initApp() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  switchTab('home');
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function saveApiKey() {
  state.apiKey = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('vaidya_api_key', state.apiKey);
  closeModal('apiModal');
}
function saveData() { localStorage.setItem('vaidya_shlokas', JSON.stringify(state.shlokas)); localStorage.setItem('vaidya_tasks', JSON.stringify(state.tasks)); }

// TAB NAVIGATION
function switchTab(tabId) {
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.remove('text-emerald-400', 'bg-slate-800');
    b.classList.add('text-slate-500');
  });
  const activeBtn = document.getElementById('nav-' + tabId);
  activeBtn.classList.add('text-emerald-400', 'bg-slate-800');
  activeBtn.classList.remove('text-slate-500');

  const main = document.getElementById('app-main');
  const tpl = document.getElementById('tpl-' + tabId).innerHTML;
  main.innerHTML = tpl;

  if (tabId === 'home') renderHome();
  if (tabId === 'tasks') renderTasks();
  if (tabId === 'vault') renderVault();
  if (tabId === 'practice') initPractice();
}

// HOME & TASKS LOGIC
function renderHome() {
  const done = state.tasks.filter(t => t.done).length;
  const total = state.tasks.length || 1;
  const pct = Math.round((done / total) * 100);
  document.getElementById('homeProgressTxt').textContent = pct + '%';
  document.getElementById('homeRing').style.strokeDashoffset = 289 - (289 * pct) / 100;
  
  let totalRead = 0, totalChants = 0;
  state.shlokas.forEach(s => { totalRead += (s.reads||0); totalChants += (s.chants||0); });
  document.getElementById('homeTotalRead').textContent = totalRead;
  document.getElementById('homeTotalChant').textContent = totalChants;
}

function renderTasks() {
  const list = document.getElementById('taskList');
  list.innerHTML = state.tasks.map(t => `
    <div class="clean-card p-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask(${t.id})">
        <div class="w-5 h-5 rounded border-2 flex items-center justify-center ${t.done ? 'bg-emerald-500 border-emerald-500 text-slate-900' : 'border-slate-600'} text-xs font-bold">${t.done ? '✓' : ''}</div>
        <span class="text-sm ${t.done ? 'text-slate-500 line-through' : 'text-slate-200'}">${t.text}</span>
      </div>
      <button onclick="delTask(${t.id})" class="text-slate-600 hover:text-red-400 px-2">✕</button>
    </div>`).join('');
}
function addTask() {
  const v = document.getElementById('taskInput').value.trim();
  if(!v) return;
  state.tasks.push({ id: Date.now(), text: v, done: false });
  saveData(); switchTab('tasks');
}
function toggleTask(id) { const t = state.tasks.find(i=>i.id===id); if(t){ t.done = !t.done; saveData(); renderTasks(); } }
function delTask(id) { state.tasks = state.tasks.filter(i=>i.id!==id); saveData(); renderTasks(); }
function resetTasks() { state.tasks.forEach(t=>t.done=false); saveData(); renderTasks(); }

// VAULT DRILL-DOWN LOGIC
function renderVault() {
  const bc = document.getElementById('vaultBreadcrumbs');
  const cnt = document.getElementById('vaultContent');
  const p = state.vaultPath;

  // Breadcrumb HTML
  let html = `<button onclick="goVault(null, null, null)">🏠 Home</button>`;
  if(p.prof) html += ` <span>›</span> <button onclick="goVault('${p.prof}', null, null)">${p.prof}</button>`;
  if(p.subject) html += ` <span>›</span> <button onclick="goVault('${p.prof}', '${p.subject}', null)">${p.subject}</button>`;
  if(p.chapter) html += ` <span>›</span> <span class="text-white">${p.chapter}</span>`;
  bc.innerHTML = html;

  // Level 1: Years
  if(!p.prof) {
    cnt.innerHTML = Object.keys(SYLLABUS).map(y => `
      <div onclick="goVault('${y}', null, null)" class="clean-card p-4 flex items-center justify-between cursor-pointer hover:bg-slate-800 transition">
        <span class="font-bold text-slate-200">📁 ${y}</span> <span class="text-slate-500">→</span>
      </div>`).join('');
    return;
  }
  // Level 2: Subjects
  if(!p.subject) {
    cnt.innerHTML = Object.keys(SYLLABUS[p.prof]).map(s => `
      <div onclick="goVault('${p.prof}', '${s}', null)" class="clean-card p-4 flex items-center justify-between cursor-pointer hover:bg-slate-800 transition">
        <span class="font-semibold text-slate-200">📘 ${s}</span> <span class="text-slate-500">→</span>
      </div>`).join('');
    return;
  }
  // Level 3: Chapters
  if(!p.chapter) {
    cnt.innerHTML = SYLLABUS[p.prof][p.subject].map(c => {
      const sh = state.shlokas.filter(x => x.prof===p.prof && x.subject===p.subject && x.chapter===c);
      let readC = 0, chantC = 0;
      sh.forEach(x => { if(x.reads>=2) readC++; if(x.chants>=2) chantC++; });
      return `
      <div onclick="goVault('${p.prof}', '${p.subject}', '${c}')" class="clean-card p-4 cursor-pointer hover:bg-slate-800 transition">
        <h4 class="font-bold text-slate-200">📑 ${c}</h4>
        <div class="flex gap-4 mt-2 text-[10px] text-slate-400">
          <span>Total: ${sh.length}</span>
          <span class="${readC>0?'text-emerald-400':''}">Read (2+): ${readC}</span>
          <span class="${chantC>0?'text-indigo-400':''}">Chants (2+): ${chantC}</span>
        </div>
      </div>`;
    }).join('');
    return;
  }
  
  // Level 4: Shlokas List
  const shlokas = state.shlokas.filter(x => x.prof===p.prof && x.subject===p.subject && x.chapter===p.chapter);
  if(!shlokas.length) {
    cnt.innerHTML = `
      <div class="text-center py-10 space-y-4">
        <p class="text-sm text-slate-400">No shlokas in this chapter yet.</p>
        <button onclick="aiFetchChapter()" id="btnAiFetch" class="btn-primary flex items-center justify-center mx-auto gap-2">
          ✨ Fetch Full Chapter via AI
        </button>
      </div>`;
    return;
  }

  cnt.innerHTML = shlokas.map(s => `
    <div class="clean-card p-4 space-y-3">
      <div class="flex justify-between items-start">
        <span class="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded">Ref: ${s.ref || 'Std Book'}</span>
        <div class="flex gap-2">
          <button onclick="editShloka('${s.id}')" class="text-xs text-amber-400">✏️</button>
          <button onclick="delShloka('${s.id}')" class="text-xs text-red-400">🗑️</button>
        </div>
      </div>
      <p class="font-devanagari text-lg font-bold text-amber-200 leading-relaxed">${s.sanskrit}</p>
      <div class="bg-slate-900/50 p-2 rounded text-xs text-slate-300"><b>Breakdown:</b> ${s.breakdown}</div>
      <p class="font-devanagari text-sm text-slate-200"><b>हिं:</b> ${s.hindi}</p>
      <p class="text-sm text-slate-400"><b>EN:</b> ${s.english}</p>
      <div class="flex justify-between text-[10px] text-slate-500 pt-2 border-t border-slate-700">
        <span>Reads: ${s.reads||0}</span> <span>Chants: ${s.chants||0}</span>
      </div>
    </div>`).join('');
}

function goVault(pr, su, ch) { state.vaultPath = { prof: pr, subject: su, chapter: ch }; renderVault(); }

function editShloka(id) {
  const s = state.shlokas.find(i=>i.id===id);
  if(!s) return;
  document.getElementById('editId').value = s.id;
  document.getElementById('editRef').value = s.ref || '';
  document.getElementById('editSan').value = s.sanskrit;
  document.getElementById('editBreak').value = s.breakdown;
  document.getElementById('editHin').value = s.hindi;
  document.getElementById('editEng').value = s.english;
  openModal('editShlokaModal');
}
function saveShloka() {
  const id = document.getElementById('editId').value;
  const s = state.shlokas.find(i=>i.id===id);
  s.ref = document.getElementById('editRef').value;
  s.sanskrit = document.getElementById('editSan').value;
  s.breakdown = document.getElementById('editBreak').value;
  s.hindi = document.getElementById('editHin').value;
  s.english = document.getElementById('editEng').value;
  saveData(); closeModal('editShlokaModal'); renderVault();
}
function delShloka(id) { if(confirm('Delete?')){ state.shlokas = state.shlokas.filter(i=>i.id!==id); saveData(); renderVault(); } }
      // AI CHAPTER FETCH LOGIC
async function aiFetchChapter() {
  if(!state.apiKey) return openModal('apiModal');
  const btn = document.getElementById('btnAiFetch');
  btn.textContent = '⏳ Fetching Chapter Data...';
  const p = state.vaultPath;
  const prompt = `You are a BAMS professor. Provide 5 most important exam shlokas for Prof "${p.prof}", Subject "${p.subject}", Chapter "${p.chapter}".
Return ONLY a JSON array: [{"ref":"Page/Ref no as per standard book","sanskrit":"Devanagari","breakdown":"Hinglish Sandhi split","hindi":"Hindi meaning","english":"English meaning"}]`;
  
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
    const arr = JSON.parse(text);
    arr.forEach((a, i) => {
      state.shlokas.push({
        id: 'ai_' + Date.now() + i, prof: p.prof, subject: p.subject, chapter: p.chapter,
        ref: a.ref, sanskrit: a.sanskrit, breakdown: a.breakdown, hindi: a.hindi, english: a.english,
        reads: 0, chants: 0
      });
    });
    saveData(); renderVault();
  } catch(e) { alert('Fetch failed. Check API key or Internet.'); btn.textContent = '✨ Fetch Full Chapter via AI'; }
}

// PRACTICE LAB LOGIC
let pracList = [], pracIdx = 0;
let mediaRec = null, audioChunks = [], recBase64 = null, recMime = '';

function initPractice() {
  pracList = state.shlokas;
  const sel = document.getElementById('pracShlokaSelect');
  if(!pracList.length) { sel.innerHTML = '<option>Vault is empty. Fetch shlokas first.</option>'; return; }
  
  sel.innerHTML = pracList.map((s,i) => `<option value="${i}">${s.chapter}: ${s.sanskrit.substring(0,15)}...</option>`).join('');
  pracIdx = 0; sel.value = 0; loadPracShloka();
}

function loadPracShloka() {
  pracIdx = parseInt(document.getElementById('pracShlokaSelect').value);
  const s = pracList[pracIdx];
  if(!s) return;
  document.getElementById('pracSan').textContent = s.sanskrit;
  document.getElementById('pracBreak').textContent = s.breakdown;
  s.reads = (s.reads || 0) + 1; saveData();
  resetRecorderUI();
}

function nextShloka() {
  if(pracIdx < pracList.length - 1) pracIdx++; else pracIdx = 0;
  document.getElementById('pracShlokaSelect').value = pracIdx;
  loadPracShloka();
}

function showMeaningAlert() {
  const s = pracList[pracIdx];
  alert(`HINDI:\n${s.hindi}\n\nENGLISH:\n${s.english}`);
}

function speakSanskrit() {
  if(!('speechSynthesis' in window)) return alert('TTS not supported.');
  const s = pracList[pracIdx];
  const utter = new SpeechSynthesisUtterance(s.sanskrit);
  utter.lang = 'hi-IN'; utter.rate = 0.8; utter.pitch = 0.95;
  window.speechSynthesis.speak(utter);
}

// RECORDER LOGIC (Retry, AI Check)
async function toggleRecord() {
  if(mediaRec && mediaRec.state === 'recording') {
    mediaRec.stop();
    document.getElementById('btnRecord').classList.remove('animate-pulse', 'bg-rose-600');
    document.getElementById('recStatus').textContent = 'Recording stopped. Play or Check AI.';
    document.getElementById('postRecActions').classList.remove('hidden');
    document.getElementById('btnRecord').classList.add('hidden');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream); audioChunks = [];
    mediaRec.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRec.onstop = () => {
      const blob = new Blob(audioChunks, { type: mediaRec.mimeType });
      recMime = mediaRec.mimeType;
      document.getElementById('audioPlayer').src = URL.createObjectURL(blob);
      const r = new FileReader(); r.onloadend = () => { recBase64 = r.result.split(',')[1]; }; r.readAsDataURL(blob);
    };
    mediaRec.start();
    document.getElementById('btnRecord').classList.add('animate-pulse', 'bg-rose-600');
    document.getElementById('recStatus').textContent = '🔴 Listening... Tap to stop.';
  } catch(e) { alert('Mic permission required.'); }
}

function retryRecord() { resetRecorderUI(); }

function resetRecorderUI() {
  if(mediaRec && mediaRec.state === 'recording') mediaRec.stop();
  document.getElementById('btnRecord').classList.remove('hidden', 'animate-pulse', 'bg-rose-600');
  document.getElementById('postRecActions').classList.add('hidden');
  document.getElementById('aiFeedback').classList.add('hidden');
  document.getElementById('recStatus').textContent = 'Tap to chant. Read clearly.';
  recBase64 = null;
}

async function checkWithAI() {
  if(!recBase64) return;
  if(!state.apiKey) return openModal('apiModal');
  const s = pracList[pracIdx];
  const btn = document.getElementById('btnCheckAi'); btn.textContent = '⏳ Evaluating...';
  
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [
        { text: `Grade Sanskrit chant against: "${s.sanskrit}". Focus on Visarga and Halant. Return JSON: {"score": 85, "comment": "short feedback"}` },
        { inline_data: { mime_type: recMime, data: recBase64 } }
      ]}]})
    });
    const d = await res.json();
    const p = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());
    document.getElementById('aiScore').textContent = p.score + '%';
    document.getElementById('aiComment').textContent = p.comment;
    document.getElementById('aiFeedback').classList.remove('hidden');
    
    s.chants = (s.chants || 0) + 1; saveData(); // Increment chant count
  } catch(e) { alert('AI Check failed.'); } finally { btn.textContent = '✨ Evaluate AI'; }
}

// START
initApp();
</script>
